name: Weekly digest email

on:
  schedule:
    # 23:00 UTC Sunday = 08:00 KST Monday
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly-digest cron route
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail -X POST "$SITE_URL/api/cron/weekly-digest" \
            -H "Authorization: Bearer $CRON_SECRET"
